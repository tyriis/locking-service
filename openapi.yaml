---
openapi: 3.1.0
info:
  title: locking-service
  description: Locking Service API documentation.
  version: 0.1.1
components:
  schemas: {}
paths:
  /:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
  /health:
    get:
      responses:
        "200":
          description: Default Response
          content:
            text/plain:
              schema:
                type: string
  /locks:
    post:
      summary: Create a new lock
      tags:
        - locks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  minLength: 3
                  description: The lock key/identifier
                owner:
                  type: string
                  description: The owner of the lock
                duration:
                  type: string
                  minLength: 2
                  description: The lock duration as timestring
              required:
                - key
                - owner
                - duration
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    description: The lock key/identifier
                  owner:
                    type: string
                    description: The owner of the lock
                  duration:
                    type: number
                    description: The lock duration in seconds
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    description: The lock creation as Date string
                  expireAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    description: The lock expire as Date string
                required:
                  - key
                  - owner
                  - duration
                  - createdAt
                  - expireAt
                additionalProperties: false
        "400":
          description: Input validation failed
        "409":
          description: A lock with given `key` already exists.
          content:
            application/json:
              schema:
                example:
                  statusCode: 409
                  message: lock 'some-fancy-lock.name' already aquired!
        "500":
          description: Internal server error
    get:
      summary: Retrieve all active locks
      tags:
        - locks
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      description: The lock key/identifier
                    owner:
                      type: string
                      description: The owner of the lock
                    duration:
                      type: number
                      description: The lock duration in seconds
                    createdAt:
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                      description: The lock creation as Date string
                    expireAt:
                      type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                      description: The lock expire as Date string
                  required:
                    - key
                    - owner
                    - duration
                    - createdAt
                    - expireAt
                  additionalProperties: false
  /locks/{key}:
    get:
      summary: Retrieve an active lock by its `key`
      tags:
        - locks
      parameters:
        - schema:
            type: string
          in: path
          name: key
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    description: The lock key/identifier
                  owner:
                    type: string
                    description: The owner of the lock
                  duration:
                    type: number
                    description: The lock duration in seconds
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    description: The lock creation as Date string
                  expireAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    description: The lock expire as Date string
                required:
                  - key
                  - owner
                  - duration
                  - createdAt
                  - expireAt
                additionalProperties: false
        "400":
          description: Input validation failed
          content:
            application/json:
              schema:
                example:
                  message:
                    - key must be longer than or equal to 3 characters
                  error: Bad Request
                  statusCode: 400
        "404":
          description: Lock with given key not found
          content:
            application/json:
              schema:
                example:
                  statusCode: 404
                  error: Not Found
                  message: lock 'some-fancy-lock.name' not found
        "500":
          description: Internal server error
    delete:
      summary: Remove an existing lock by its `key`
      tags:
        - locks
      parameters:
        - schema:
            type: string
          in: path
          name: key
          required: true
      responses:
        "200":
          description: Default Response
